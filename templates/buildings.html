{% extends 'base_site.html' %}
{% block main_content %}
    <style>
        .card {
            border: none;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }

        .card-title {
            color: #718096;
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.025em;
        }
        /* Base card style for smooth transition */
        .card {
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            border: 1px solid rgba(0, 0, 0, 0.125);
            /* Subtle border */
        }

        /* Hover State */
        .card:hover {
            transform: translateY(-8px);
            /* Lifts the card up */
            box-shadow: 0 14px 28px rgba(0, 0, 0, 0.1), 0 10px 10px rgba(0, 0, 0, 0.08);
            /* Modern soft shadow */
            border-color: rgba(0, 123, 255, 0.5);
            /* Optional: slight color change to the border */
            cursor: pointer;
        }

    </style>

    <div class="page-header">
        <h1>Planteles</h1>
        <a href="{% url 'new_building' %}"><button type="button" class="btn btn-primary">Nuevo plantel <i class="bi bi-building-add"></i></button></a>
    </div>
    <div class="d-flex flex-lg-column justify-content-center align-items-stretch gap-3">
    {% if buildings %}
        {% for building in buildings %}
            <div class="card flex-fill">
                <div class="card-body">
                    <div class="card-title"><h5>Plantel {{ building.name }}</h5></div>
                </div>
            </div>

        {% endfor %}
    </div>
    {% else %}
        <p>Ningún plantel ha sido creado</p>
    {% endif %}

{% endblock %}
